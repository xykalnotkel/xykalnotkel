<svg xmlns="http://www.w3.org/2000/svg" width="900" height="68" viewBox="0 0 900 68" role="img" aria-label="XySpace animated introduction">
  <defs>
    <linearGradient id="line" x1="0" x2="1">
      <stop offset="0" stop-color="#5d3b88" stop-opacity="0"/>
      <stop offset=".5" stop-color="#a78bda"/>
      <stop offset="1" stop-color="#5d3b88" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <rect x="12" y="8" width="876" height="52" rx="26" fill="#0e0d13" stroke="#3b2d4c"/>
  <path d="M80 58H820" stroke="url(#line)" stroke-width="2" opacity=".55"/>
  <circle cx="52" cy="34" r="5" fill="#a78bda">
    <animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="18" text-anchor="middle">
    <text x="450" y="40" fill="#f5f3f8" opacity="1">Creative Technologist &amp; App Developer
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" keyTimes="0;.27;.32;.61;.66;.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="40" fill="#d5c7ea" opacity="0">Building XySpace from Indonesia
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" keyTimes="0;.27;.32;.61;.66;.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
    <text x="450" y="40" fill="#c4b5dc" opacity="0">Web • Apps • Games • AI Tools • Cloud
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" keyTimes="0;.27;.32;.61;.66;.95;1" dur="12s" repeatCount="indefinite"/>
    </text>
  </g>
  <rect x="718" y="21" width="2" height="24" rx="1" fill="#f5f3f8">
    <animate attributeName="opacity" values="1;0;1" dur=".85s" repeatCount="indefinite"/>
  </rect>
  <circle cx="147" cy="14" r="2" fill="#fff" opacity=".4">
    <animate attributeName="cy" values="14;10;14" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="756" cy="54" r="2.5" fill="#9675c4" opacity=".65">
    <animate attributeName="cx" values="756;768;756" dur="5s" repeatCount="indefinite"/>
  </circle>
</svg>
